/* V3.3 악보 스와이프 뷰어 */
.viewer.open{display:block;position:fixed;inset:0;z-index:1000;background:var(--paper-color,#f7f7f5)!important;overflow:hidden}
.viewer .toolbar{position:absolute;left:0;right:0;top:0;z-index:30;transform:translateY(-115%);transition:transform .22s ease;background:rgba(255,255,255,.97);box-shadow:0 3px 14px rgba(0,0,0,.18);padding:max(10px,env(safe-area-inset-top)) 12px 10px}

.viewer:fullscreen,.viewer:-webkit-full-screen{background:var(--paper-color,#f7f7f5)!important}

/* V3.14: Android 로컬/전체화면에서도 악보 주변 여백을 강제로 종이색으로 덮는다. */

/* V3.15: 97% 유지 + 악보 표시영역/여백을 #FFFFFF로 고정, 다크모드 자동변환 차단 */

}
function toggleCategories(force){
  const grid=document.getElementById('categoryGrid');
  const toggle=document.getElementById('categoryToggle');
  if(!grid||!toggle)return;
  const willOpen = typeof force==='boolean' ? force : grid.classList.contains('category-collapsed');
  grid.classList.toggle('category-collapsed',!willOpen);
  toggle.classList.toggle('open',willOpen);
}

function clearCategorySelection(){
  activeCategory='';

function showCategory(name){
  const cat=hymnCategories.find(c=>c.name===name);
  if(!cat)return;
  activeCategory=name;
  toggleCategories(false);
  document.querySelectorAll('.category-btn').forEach(b=>b.classList.toggle('active',b.dataset.category===name));
  const nums=categoryNumbers(cat);
  const head=document.getElementById('categoryResultHead');
  head.style.display='flex';
  head.innerHTML=`<b>${name} 성가</b><span>${nums.length}곡</span>`;
  results.innerHTML=nums.map(n=>{
    const h=hymns[n];

  document.getElementById('q').value='';
  head.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function search(){clearCategorySelection();
 const s=q.value.trim().toLowerCase(); if(!s){renderDefault();return}
 const ns=s.replace(/\s+/g,'');
 let arr=Object.values(hymns).filter(h=>String(h.number)===s || (h.title||'').toLowerCase().replace(/\s+/g,'').includes(ns));
 if(/^\d+$/.test(s)){ const n=+s; arr=Object.values(hymns).filter(h=>String(h.number).includes(s)); arr.sort((a,b)=>(a.number===n?-1:b.number===n?1:a.number-b.number)); }
 results.innerHTML=arr.slice(0,80).map(h=>`<button class="item" onclick="openHymn(${h.number})"><div class="num">${h.number}번</div><div><div class="title">${h.title||'가톨릭 성가 '+h.number+'번'}</div><div class="sub">${h.pageCount}페이지 · 악보 바로보기</div></div></button>`).join('') || '<div class="note">검색 결과가 없습니다.</div>';
}

function openHymn(n,page=0,source='search',sequence=null){
 const h=hymns[n]; if(!h)return;
 if(!viewer.classList.contains('open'))returnScrollY=window.scrollY||0;
 current=n; currentPage=page; viewerSource=source;
 viewerSequence=Array.isArray(sequence)?sequence.map(Number).filter(x=>hymns[x]):[];
 viewerSeqIndex=viewerSequence.indexOf(Number(n));
 home.classList.add('hidden'); viewer.classList.add('open'); viewer.classList.toggle('schedule-mode',viewerSource==='schedule');
 document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'; renderHymnPage(); showControls(false);
 try{localStorage.setItem('lastHymn',n)}catch(e){}
}
function finishBack(){
 viewer.classList.remove('open','controls-show','schedule-mode','fullscreen-mode'); home.classList.remove('hidden'); document.documentElement.style.overflow='';document.body.style.overflow='';
 viewerSequence=[]; viewerSeqIndex=-1; clearTimeout(controlsTimer);
 requestAnimationFrame(()=>{window.scrollTo(0,returnScrollY); requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')))});
}
async function back(){
 hideControls();
 if(document.fullscreenElement){
   try{await document.exitFullscreen();}catch(e){}
 }
 finishBack();
}
function moveHymn(d){
 let n=current+d; if(n<1)n=528;if(n>528)n=1;
 current=n; currentPage=d<0?((viewerSource==='schedule'&&accompMassOpen&&accompScoreByNumber[n])||hymns[n]).pages.length-1:0; renderHymnPage(); hideControls();
}
function turnPage(d){
 const h=currentDisplayedHymn(); if(!h)return;
 const p=currentPage+d;
 if(p>=0 && p<h.pages.length){currentPage=p;renderHymnPage();return}
 if(viewerSource==='schedule'){
   if(viewerSequence.length>1 && viewerSeqIndex>=0){
     const nextIndex=viewerSeqIndex+(d>0?1:-1);
     if(nextIndex>=0 && nextIndex<viewerSequence.length){
       viewerSeqIndex=nextIndex; current=viewerSequence[viewerSeqIndex];
       currentPage=d>0?0:currentDisplayedHymn().pages.length-1;
       renderHymnPage(); hideControls(); return;
     }
   }
   currentPage=d>0?h.pages.length-1:0; renderHymnPage(); hideControls(); return;
 }
 moveHymn(d>0?1:-1);
}
function isHymnFullscreen(){return !!document.fullscreenElement || viewer.classList.contains('fullscreen-mode')}
function syncFullscreenButton(){
 const btn=viewer.querySelector('.toolbar button:last-child');
 if(btn)btn.textContent=isHymnFullscreen()?'전체화면 종료':'전체화면';
}
async function full(){
 if(isHymnFullscreen()){
   if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}
   viewer.classList.remove('fullscreen-mode');
   showControls(false); syncFullscreenButton();return;
 }
 // 임베드/모바일 브라우저가 Fullscreen API를 막아도 뷰어 전용 모드로 동작
 viewer.classList.add('fullscreen-mode');
 try{
   if(typeof viewer.requestFullscreen==='function')await viewer.requestFullscreen();
   else if(typeof viewer.webkitRequestFullscreen==='function')viewer.webkitRequestFullscreen();
 }catch(e){console.warn('브라우저 전체화면 제한: 뷰어 모드로 전환',e)}
 showControls(false);syncFullscreenButton();
}
function showControls(force){
 viewer.classList.add('controls-show');clearTimeout(controlsTimer);
 if(isHymnFullscreen() && (!force || !folderHelp.classList.contains('show'))){
   controlsTimer=setTimeout(()=>viewer.classList.remove('controls-show'),1000);
 }
}
function hideControls(){
 clearTimeout(controlsTimer);
 if(isHymnFullscreen())viewer.classList.remove('controls-show');
 else viewer.classList.add('controls-show');
}
function toggleControls(){
 if(!isHymnFullscreen()){showControls(false);return;}
 if(viewer.classList.contains('controls-show'))hideControls();else showControls(false);
}
let pointerDown=false,pointerX=0,pointerY=0,pointerT=0;
pages.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pointerDown=true;pointerX=e.clientX;pointerY=e.clientY;pointerT=Date.now();try{pages.setPointerCapture(e.pointerId)}catch(_){};e.preventDefault()});
pages.addEventListener('pointermove',e=>{if(!pointerDown)return;const dx=e.clientX-pointerX,dy=e.clientY-pointerY;if(Math.abs(dx)>15&&Math.abs(dx)>Math.abs(dy)){hideControls();}});
pages.addEventListener('pointerup',e=>{if(!pointerDown)return;pointerDown=false;const dx=e.clientX-pointerX,dy=e.clientY-pointerY,dt=Date.now()-pointerT;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.15&&dt<1200){hideControls();turnPage(dx<0?1:-1);e.preventDefault();return}if(Math.abs(dx)<14&&Math.abs(dy)<14){toggleControls();e.preventDefault()}});
pages.addEventListener('pointercancel',()=>{pointerDown=false});
pages.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown')turnPage(1);if(e.key==='ArrowLeft'||e.key==='PageUp')turnPage(-1);if(e.key==='Escape'&&!document.fullscreenElement){if(isHymnFullscreen()){viewer.classList.remove('fullscreen-mode');showControls(false);syncFullscreenButton()}else back()}});

const psalmStatus={};
function psalmAsset(d){return PSALM_ASSETS[d.date]||null;}

 Object.keys(PSALM_ASSETS).forEach(date=>{

function isMassDay(d){

function massEntriesForDay(d){

 if(monthView==='today'){days=(now.getFullYear()===monthlyData.year&&now.getMonth()+1===monthlyData.month)?days.filter(d=>d.day===now.getDate()):[]}

}

let statsType='all';
const statRoleLabels={entrance:'입당',offertory:'봉헌',communion:'성체',recessional:'파견'};

function normalizeStatNums(v){
 if(Array.isArray(v))return v.map(Number).filter(n=>hymns[n]);
 if(v===null||v===undefined||v==='')return [];
 if(typeof v==='number')return hymns[v]?[v]:[];
 return String(v).split(/[,/·\s]+/).map(x=>Number(x)).filter(n=>hymns[n]);
}
function getAllScheduleRows(){
 // 현재는 2026년 11월 데이터가 실제 등록되어 있다.
 // 향후 과거 월별 데이터가 추가되면 monthlyArchive 배열에 같은 형식으로 넣으면 기간 통계에 자동 포함된다.
 let packs=[];
 if(typeof monthlyArchive!=='undefined' && Array.isArray(monthlyArchive)) packs=packs.concat(monthlyArchive);
 if(typeof monthlyData!=='undefined' && monthlyData && Array.isArray(monthlyData.days)) packs.push(monthlyData);
 if(!packs.length && typeof monthData!=='undefined' && Array.isArray(monthData)) return monthData;
 if(!packs.length && typeof schedule!=='undefined' && Array.isArray(schedule)) return schedule;
 const seen=new Set(), rows=[];
 packs.forEach(pack=>{
   const y=Number(pack.year)||0, m=Number(pack.month)||0;
   (pack.days||[]).forEach(row=>{
     const key=`${y}-${m}-${row.date||row.day||''}-${row.liturgy||row.title||row.name||''}`;
     if(seen.has(key))return; seen.add(key);
     rows.push(Object.assign({},row,{_statYear:y,_statMonth:m}));
   });
 });
 return rows;
}
function getScheduleRows(){
 const sy=Number(document.getElementById('statsStartYear')?.value||2026);
 const ey=Number(document.getElementById('statsEndYear')?.value||2026);
 const sm=0;
 const from=Math.min(sy,ey), to=Math.max(sy,ey);
 return getAllScheduleRows().filter(row=>{
   const y=Number(row._statYear || (typeof monthlyData!=='undefined'?monthlyData.year:0));
   const m=Number(row._statMonth || (typeof monthlyData!=='undefined'?monthlyData.month:0));
   return y>=from && y<=to && (!sm || m===sm);
 });
}
function applyStatsPeriod(){
 let sy=Number(document.getElementById('statsStartYear').value);
 let ey=Number(document.getElementById('statsEndYear').value);
 if(sy>ey){
   // 범위가 뒤집히면 사용자가 마지막으로 고른 값에 맞춰 자동 정렬
   const t=sy; sy=ey; ey=t;
   document.getElementById('statsStartYear').value=sy;
   document.getElementById('statsEndYear').value=ey;
 }
 const m=0;
 const label=sy===ey ? `${sy}년${m?' '+m+'월':' 전체'}` : `${sy}~${ey}년${m?' '+m+'월':' 전체'}`;
 document.getElementById('statsPeriod').textContent=label;
 renderStats();
}
function extractRole(row,role){
 const keys={
  entrance:['entrance','입당','in'],
  offertory:['offertory','봉헌','offer'],
  communion:['communion','성체','성체','communionHymns'],
  recessional:['recessional','파견','out']
 }[role];
 for(const k of keys){ if(row && row[k]!==undefined) return normalizeStatNums(row[k]); }
 // 현재 V3 계열 데이터의 songs 객체도 지원
 if(row && row.songs){
   const map={entrance:['entrance','입당'],offertory:['offertory','봉헌'],communion:['communion','성체','성체'],recessional:['recessional','파견']};
   for(const k of map[role]) if(row.songs[k]!==undefined)return normalizeStatNums(row.songs[k]);
 }
 return [];
}
function rowDateText(row){
 return row.date||row.day||row.dateText||'';
}
function rowLiturgy(row){
 return row.liturgy||row.title||row.name||'';
}
function buildStats(){
 const rows=getScheduleRows(), counts={}, history={};
 const roles=['entrance','offertory','communion','recessional'];
 rows.forEach(row=>{
   roles.forEach(role=>{
     extractRole(row,role).forEach(n=>{
       counts[n]??={all:0,entrance:0,offertory:0,communion:0,recessional:0};
       counts[n][role]++; counts[n].all++;
       history[n]??=[];
       history[n].push({date:rowDateText(row),role:statRoleLabels[role],liturgy:rowLiturgy(row)});
     });
   });
 });
 return {rows,counts,history};
}
function renderStats(){
 const data=buildStats(), entries=Object.entries(data.counts)
  .map(([n,c])=>({n:Number(n),count:c[statsType]||0}))
  .filter(x=>x.count>0)
  .sort((a,b)=>b.count-a.count||a.n-b.n);

 const selectedNums=Object.keys(data.counts).map(Number).filter(n=>n>=1&&n<=528).sort((a,b)=>a-b);
 const unique=selectedNums.length;
 const unused=528-unique;
 const percent=(unique/528*100).toFixed(1);
 document.getElementById('statsSummary').innerHTML=`
   <button type="button" class="stats-summary-card stats-summary-action" onclick="toggleSelectedHymns()" aria-controls="statsSelectedList" aria-expanded="${!document.getElementById('statsSelectedList').hidden}"><span>선곡 성가 <small>목록 보기</small></span><strong>${unique}<small>곡</small></strong></button>
   <div class="stats-summary-card"><span>미선곡 성가</span><strong>${unused}<small>곡</small></strong></div>
   <div class="stats-summary-card"><span>성가 선곡률</span><strong>${percent}<small>%</small></strong></div>`;
 const selectedBox=document.getElementById('statsSelectedList');
 if(!selectedBox.hidden) renderSelectedHymns(data,selectedNums);
 document.getElementById('statsRankingTitle').textContent=(statsType==='all'?'전체':statRoleLabels[statsType])+' 사용 순위';
 document.getElementById('statsRanking').innerHTML=entries.length?entries.map((x,i)=>{
   const h=hymns[x.n];
   return `<button class="rank-row" onclick="showHymnHistory(${x.n})"><span class="rank-no">${i+1}</span><span class="rank-hymn">${x.n}</span><span class="rank-title">${h?h.title:''}</span><span class="rank-count">${x.count}회</span></button>`;
 }).join(''):'<div style="padding:20px;text-align:center;color:#7a8392">집계할 데이터가 없습니다.</div>';
 document.getElementById('statsHistory').style.display='none';
}
function toggleSelectedHymns(){

}
