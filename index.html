let viewerSequence=[];

const pageImage=document.getElementById('pageImage');
const pageIndicator=document.getElementById('pageIndicator');
renderDefault();
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});

function renderDefault(){results.innerHTML='<div class="note">성가번호나 제목을 입력해 주세요. 예: 285, 성모, 주님</div>'}
function search(){
 const s=q.value.trim().toLowerCase(); if(!s){renderDefault();return}
 const ns=s.replace(/\s+/g,'');
 let arr=Object.values(hymns).filter(h=>String(h.number)===s || (h.title||'').toLowerCase().replace(/\s+/g,'').includes(ns));
 if(/^\d+$/.test(s)){ const n=+s; arr=Object.values(hymns).filter(h=>String(h.number).includes(s)); arr.sort((a,b)=>(a.number===n?-1:b.number===n?1:a.number-b.number)); }
 results.innerHTML=arr.slice(0,80).map(h=>`<button class="item" onclick="openHymn(${h.number})"><div class="num">${h.number}번</div><div><div class="title">${h.title||'가톨릭 성가 '+h.number+'번'}</div><div class="sub">${h.pageCount}페이지 · 악보 바로보기</div></div></button>`).join('') || '<div class="note">검색 결과가 없습니다.</div>';
}
function getHymnSrc(path){
 // 웹 배포판: index.html 옆 hymns 폴더에서 직접 로드
 return path;
}
function renderHymnPage(){
 const h=hymns[current]; if(!h)return;
 currentPage=Math.max(0,Math.min(currentPage,h.pages.length-1));
 imageErrorShown=false; folderHelp.classList.remove('show'); pageImage.style.display='block';
 pageImage.alt=`${current}번 성가 ${currentPage+1}페이지`;
 pageImage.src=getHymnSrc(h.pages[currentPage]);
 pageIndicator.textContent=`${currentPage+1} / ${h.pages.length}`;
 vtitle.textContent=`${current}번 ${h.title||''}  ·  ${currentPage+1}/${h.pages.length}`;
}
pageImage.onload=function(){
 // V3.15: 악보 원본 바탕에 맞춰 여백을 순백색으로 고정. 브라우저 다크모드 영향 차단.
 const paper='#ffffff';
 viewer.style.setProperty('--paper-color',paper);
 const stage=document.querySelector('.page-stage');
 if(stage) stage.style.setProperty('background-color',paper,'important');
 viewer.style.setProperty('background-color',paper,'important');
}
pageImage.onerror=function(){hymnImageError(this)};
function hymnImageError(img){
 img.style.display='none';
 if(!imageErrorShown){
   imageErrorShown=true;
   folderHelp.innerHTML='<b>악보를 불러오지 못했습니다</b><p>배포 서버의 <b>hymns</b> 폴더와 WebP 파일을 확인해 주세요.</p>';
   folderHelp.classList.add('show');
   showControls(true);
 }
}
function openHymn(n,page=0,source='search',sequence=null){
 const h=hymns[n]; if(!h)return;
 if(!viewer.classList.contains('open'))returnScrollY=window.scrollY||0;
 current=n; currentPage=page; viewerSource=source;
 viewerSequence=Array.isArray(sequence)?sequence.map(Number).filter(x=>hymns[x]):[];
 viewerSeqIndex=viewerSequence.indexOf(Number(n));
 home.classList.add('hidden'); viewer.classList.add('open'); viewer.classList.toggle('schedule-mode',viewerSource==='schedule');
 document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'; renderHymnPage(); hideControls();
 try{localStorage.setItem('lastHymn',n)}catch(e){}
}
function finishBack(){
 viewer.classList.remove('open','controls-show','schedule-mode'); home.classList.remove('hidden'); document.documentElement.style.overflow='';document.body.style.overflow='';
 viewerSequence=[]; viewerSeqIndex=-1; clearTimeout(controlsTimer);
 requestAnimationFrame(()=>{window.scrollTo(0,returnScrollY); requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')))});
}
async function back(){
 hideControls();
 if(document.fullscreenElement){
   try{await document.exitFullscreen();}
   catch(e){}
   setTimeout(finishBack,80);
 }else finishBack();
}
function moveHymn(d){
 let n=current+d; if(n<1)n=528;if(n>528)n=1;
 current=n; currentPage=d<0?hymns[n].pages.length-1:0; renderHymnPage(); hideControls();
}
function turnPage(d){
 const h=hymns[current]; if(!h)return;
 const p=currentPage+d;
 if(p>=0 && p<h.pages.length){currentPage=p;renderHymnPage();return}
 // 성가표에서는 같은 구분(봉헌/영성체 등)에 2곡 이상 있을 때만 그 곡들 사이 이동
 if(viewerSource==='schedule'){
   if(viewerSequence.length>1 && viewerSeqIndex>=0){
     const nextIndex=viewerSeqIndex+(d>0?1:-1);
     if(nextIndex>=0 && nextIndex<viewerSequence.length){
       viewerSeqIndex=nextIndex; current=viewerSequence[viewerSeqIndex];
       currentPage=d>0?0:hymns[current].pages.length-1;
       renderHymnPage(); hideControls(); return;
     }
   }
   currentPage=d>0?h.pages.length-1:0; renderHymnPage(); hideControls(); return;
 }
 // 성가 검색에서만 앞/뒤 성가로 연속 탐색
 moveHymn(d>0?1:-1);
}
function full(){
 let e=viewer; if(!document.fullscreenElement)e.requestFullscreen?.();else document.exitFullscreen?.(); showControls(true);
}
function showControls(force){
 viewer.classList.add('controls-show'); clearTimeout(controlsTimer);
 if(!force || !folderHelp.classList.contains('show'))controlsTimer=setTimeout(()=>viewer.classList.remove('controls-show'),5000);
}
function hideControls(){
 viewer.classList.remove('controls-show'); clearTimeout(controlsTimer);
}
function toggleControls(){
 if(viewer.classList.contains('controls-show'))hideControls();else showControls(false);
}
let pointerDown=false,pointerX=0,pointerY=0,pointerT=0;
pages.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pointerDown=true;pointerX=e.clientX;pointerY=e.clientY;pointerT=Date.now();try{pages.setPointerCapture(e.pointerId)}catch(_){};e.preventDefault()});
pages.addEventListener('pointermove',e=>{if(!pointerDown)return;const dx=e.clientX-pointerX,dy=e.clientY-pointerY;if(Math.abs(dx)>15&&Math.abs(dx)>Math.abs(dy)){hideControls();}});
pages.addEventListener('pointerup',e=>{if(!pointerDown)return;pointerDown=false;const dx=e.clientX-pointerX,dy=e.clientY-pointerY,dt=Date.now()-pointerT;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.15&&dt<1200){hideControls();turnPage(dx<0?1:-1);e.preventDefault();return}if(Math.abs(dx)<14&&Math.abs(dy)<14){toggleControls();e.preventDefault()}});
pages.addEventListener('pointercancel',()=>{pointerDown=false});
pages.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown')turnPage(1);if(e.key==='ArrowLeft'||e.key==='PageUp')turnPage(-1);if(e.key==='Escape'&&!document.fullscreenElement)back()});

let monthView='all';
function songBoxes(d){
 const labels=['입당','봉헌','영성체','파견'];
 return labels.map(k=>{let a=(d.songs[k]||[]);let seq=JSON.stringify(a);let body=a.map(n=>`<button class="song-link" onclick="openHymn(${n},0,'schedule',${seq})">${n}</button>`).join('');if(k==='봉헌'&&d.봉헌텍스트)body+=`<span>${d.봉헌텍스트}</span>`;return `<div class="song-box"><b>${k}</b>${body||'<span class="empty-song">-</span>'}</div>`}).join('');
}
function dayCard(d){
 const has=['입당','봉헌','영성체','파견'].some(k=>(d.songs[k]||[]).length)||d.봉헌텍스트;
 return `<div class="month-card ${d.weekday==='주일'?'sunday':''}"><div class="month-head"><div class="date-badge">11/${d.day} ${d.weekday}</div><div class="liturgy">${d.liturgy||' '}</div></div>${has?`<div class="song-grid">${songBoxes(d)}</div>`:'<div class="note">지정 성가 없음</div>'}</div>`;
}
function renderTodayHighlight(){
 const now=new Date(); let d=null;
 if(now.getFullYear()===monthlyData.year && now.getMonth()+1===monthlyData.month)d=monthlyData.days.find(x=>x.day===now.getDate());
 if(!d){todayHighlight.innerHTML='';return}
 todayHighlight.innerHTML=`<div class="today-highlight"><h3>오늘의 성가 · 11/${d.day} ${d.weekday}</h3><p>${d.liturgy||''}</p><div class="song-grid">${songBoxes(d)}</div></div>`;
}
function setMonthView(v){monthView=v;document.querySelectorAll('.view-filter button').forEach(b=>b.classList.remove('active'));document.getElementById(v==='today'?'viewToday':v==='sunday'?'viewSunday':'viewAll').classList.add('active');renderMonthList()}
function renderMonthList(){
 const now=new Date(); let days=monthlyData.days;
 if(monthView==='today'){days=(now.getFullYear()===monthlyData.year&&now.getMonth()+1===monthlyData.month)?days.filter(d=>d.day===now.getDate()):[]}
 if(monthView==='sunday')days=days.filter(d=>d.weekday==='주일');
 if(monthView==='all'&&now.getFullYear()===monthlyData.year&&now.getMonth()+1===monthlyData.month)days=days.filter(d=>d.day!==now.getDate());
 monthList.innerHTML=(days.length?days.map(dayCard).join(''):'<div class="note">해당 날짜의 성가표가 없습니다.</div>')+(monthView==='all'?renderSpecial():'');
}
function renderMonth(){renderTodayHighlight();renderMonthList();}
function renderSpecial(){return Object.entries(monthlyData.special).map(([name,obj])=>`<div class="special-card"><h3>${name}</h3>${Object.entries(obj).map(([k,a])=>`<div class="special-row"><b>${k}</b>　${a.map(n=>`<button class="song-link" onclick="openHymn(${n},0,'schedule',${JSON.stringify(a)})">${n}</button>`).join(' ')}</div>`).join('')}</div>`).join('')}
function showSearch(){searchPanel.style.display='block';todayPanel.style.display='none';document.querySelectorAll('.tab')[0].classList.add('active');document.querySelectorAll('.tab')[1].classList.remove('active')}
function showToday(){renderMonth();searchPanel.style.display='none';todayPanel.style.display='block';document.querySelectorAll('.tab')[1].classList.add('active');document.querySelectorAll('.tab')[0].classList.remove('active')}
</script></body></html>
